[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "req-insight"
version = "0.1.0"
description = "需求影响评估：业务全景图 + 知识图谱 + 需求左移解构 + 影响面分析"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.100.0"]
dev = ["pytest>=8.0"]

[project.scripts]
req-insight = "req_insight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
